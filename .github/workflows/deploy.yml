name: Deploy RAN4 Schedule

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check public 3GPP history folder for schedule updates
        id: poll
        if: github.event_name == 'schedule'
        run: python scripts/update_schedule.py --output schedule.json --github-output "$GITHUB_OUTPUT"
      - name: Commit detected schedule update
        if: github.event_name == 'schedule' && steps.poll.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          git commit -m "Update schedule from 3GPP history"
          git push
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.poll.outputs.changed == 'true'
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.poll.outputs.changed == 'true'
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: github.event_name != 'schedule' || steps.poll.outputs.changed == 'true'
